<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <link rel="stylesheet" href="brand/tokens.css" />
    <link rel="stylesheet" href="brand/collage/collage.css" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="brand/collage/collage.js"></script>
    <style>
      /* Grid positions (12 x 6). The circle is placed in JS on the camera's mass. */
      #chapter { --c: 0; --r: 0; }
      #label { --c: 0; --r: 1.15; }
      #headline { --c: 0; --r: 1.75; width: calc(6 * var(--gx)); }
      #sub { --c: 0; --r: 3.95; width: calc(4 * var(--gx)); }
      #strip { --c: 0; --r: 5.05; --cs: 5; --rs: 0.62; transform: rotate(-1deg); }
      #camera { --c: 7.7; --r: 0.15; height: calc(5.7 * var(--gy)); aspect-ratio: 770 / 1921; transform: rotate(5deg); }

      @container (aspect-ratio < 0.8) {
        #chapter { --c: 0; --r: 0; }
        #label { --c: 0; --r: 0.75; }
        #headline { --c: 0; --r: 1.15; width: calc(4 * var(--gx)); }
        #sub { --c: 0; --r: 2.55; width: calc(3.1 * var(--gx)); }
        #camera { --c: 1.2; --r: 3.3; height: calc(3.85 * var(--gy)); }
        #strip { --c: 0; --r: 7.4; --cs: 4; --rs: 0.55; }
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="collage-title" data-start="0" data-duration="1" data-width="1920" data-height="1080">
      <img class="grain" data-depth="0" src="assets/placeholder/paper-grain.jpg" alt="" />
      <div class="g gs" id="strip" data-depth="0"></div>

      <div class="circle yellow" id="circle" data-depth="1"></div>

      <div class="cutout g" id="camera" data-depth="2" data-asset="rolleiflex.png">
        <img
          src="assets/placeholder/rolleiflex.png"
          alt=""
          data-color-grading='{"intensity":1,"effects":{"monoScreen":1,"monoScreenSize":0.2,"monoScreenAngle":0.25,"monoScreenSpread":0.3,"monoScreenShape":0,"monoScreenInvert":0},"palette":["#1A1714","#FAF6EC"]}'
        />
      </div>

      <div class="chapter g" id="chapter" data-depth="3">01.</div>
      <div class="label-box g" id="label" data-depth="3">Chapter one</div>
      <h1 class="headline g" id="headline" data-depth="3">How film<br />sees <span class="mark">colour</span></h1>
      <p class="small g" id="sub" data-depth="3">Three layers of silver, three dyes, and the curve that decides what you keep.</p>
    </div>

    <script type="module">
      import anchors from "./assets/placeholder/anchors.json" with { type: "json" };

      await document.fonts.ready;
      const c = collage.setup({ anchors });

      // Circle field: centred on the hero's mass, 0.8 x its height.
      const cam = c.box("camera");
      const d = cam.h * 0.8;
      Object.assign(document.getElementById("circle").style, {
        width: `${d}px`, height: `${d}px`,
        left: `${cam.x + cam.w / 2 - d / 2}px`, top: `${cam.y + cam.h / 2 - d / 2}px`,
      });

      // Light: the sunburst comes from the taking lens.
      // In front of the body, starting at the lens rim, so it reads as light at the lens.
      c.sunburst({ at: c.feature("camera", "taking-lens"), inner: 7.5, outer: [15, 19], depth: 3 });

      // Texture: an enlarger test strip, one stop per band.
      c.testStrip("strip", { base: 2, steps: 6 });

      const tl = gsap.timeline({ paused: true });
      tl.set({}, {}, 1);
      window.__timelines = window.__timelines || {};
      window.__timelines["collage-title"] = tl;
    </script>
  </body>
</html>

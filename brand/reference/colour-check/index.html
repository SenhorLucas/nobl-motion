<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      #root {
        width: 100%;
        height: 100%;
      }
      /* The patch colours are the data under test, so they are set from the
         JSON, never from tokens. No borders, gutters or text in the cells. */
      #grid {
        position: absolute;
        inset: 0;
        display: grid;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="colour-check"
      data-start="0"
      data-duration="1"
      data-width="1920"
      data-height="1080"
    >
      <div id="grid"></div>
    </div>
    <script type="module">
      import spec from "./brand/reference/colour-check/data/patches.json" with { type: "json" };

      const grid = document.getElementById("grid");
      grid.style.gridTemplateColumns = `repeat(${spec.cols}, 1fr)`;
      grid.style.gridTemplateRows = `repeat(${spec.rows}, 1fr)`;
      for (const p of spec.patches) {
        const cell = document.createElement("div");
        cell.style.background = `rgb(${p.rgb.join(" ")})`;
        grid.append(cell);
      }

      const tl = gsap.timeline({ paused: true });
      tl.set({}, {}, 1);
      window.__timelines = window.__timelines || {};
      window.__timelines["colour-check"] = tl;
    </script>
  </body>
</html>

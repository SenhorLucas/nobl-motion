<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <link rel="stylesheet" href="brand/tokens.css" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--darkroom);
      }
      #root {
        width: 100%;
        height: 100%;
        container-type: size;
        font-family: var(--font);
        color: var(--on-darkroom);
      }

      /* One file, three ratios: the grid reflows on the root's aspect ratio. */
      .card {
        position: absolute;
        inset: var(--safe-action);
        display: grid;
        gap: var(--s-6);
        grid-template-columns: 1fr;
        grid-template-areas: "head" "chart" "cube" "pal";
        grid-template-rows: auto 1fr 1fr auto;
      }
      @container (aspect-ratio > 1.2) {
        .card {
          grid-template-columns: 1.15fr 1fr 1fr;
          grid-template-areas: "head chart cube" "pal pal pal";
          grid-template-rows: 1fr auto;
        }
      }
      @container (0.8 <= aspect-ratio <= 1.2) {
        .card {
          grid-template-columns: 1fr 1fr;
          grid-template-areas: "head head" "chart cube" "pal pal";
          grid-template-rows: auto 1fr auto;
        }
      }

      .head {
        grid-area: head;
        align-self: center;
      }
      .eyebrow {
        font-size: var(--t-label);
        font-weight: 600;
        letter-spacing: var(--tr-label);
        text-transform: uppercase;
        color: var(--on-darkroom-muted);
        margin: 0 0 var(--s-4);
      }
      .headline {
        font-size: var(--t-headline);
        font-weight: 700;
        line-height: var(--lh-tight);
        letter-spacing: var(--tr-headline);
        margin: 0 0 var(--s-5);
      }
      .headline span {
        display: inline-block;
      }
      .body {
        font-size: var(--t-body);
        font-weight: 400;
        line-height: var(--lh-body);
        color: var(--on-darkroom-muted);
        margin: 0;
        max-width: 22em;
      }

      /* Figures: honest neutral ground, warm chrome stops at the frame. */
      .figure {
        position: relative;
        background: var(--viz-ground);
        border: var(--hairline) solid var(--darkroom-line);
        border-radius: var(--r-md);
        overflow: hidden;
        min-height: 0;
      }
      .figure .caption {
        position: absolute;
        left: var(--s-4);
        top: var(--s-3);
        font-size: var(--t-label);
        font-weight: 600;
        letter-spacing: var(--tr-label);
        text-transform: uppercase;
        color: var(--viz-ink-muted);
      }
      .chart {
        grid-area: chart;
      }
      .cube {
        grid-area: cube;
      }
      .chart svg {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      .cube canvas {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        top: calc(var(--t-label) * 1.2 + var(--s-3) * 2);
        width: 100%;
        height: calc(100% - var(--t-label) * 1.2 - var(--s-3) * 2);
      }
      .chart text {
        font-family: var(--font-data);
        font-size: var(--t-data);
        font-variant-numeric: tabular-nums;
        fill: var(--viz-ink-muted);
      }

      .palette {
        grid-area: pal;
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: var(--s-3) var(--s-4);
      }
      @container (aspect-ratio > 1.2) {
        .palette {
          grid-template-columns: repeat(8, 1fr);
        }
      }
      .swatch {
        display: flex;
        flex-direction: column;
        gap: var(--s-2);
      }
      .swatch .chip {
        height: 6cqmin;
        border-radius: var(--r-sm);
        border: var(--hairline) solid var(--darkroom-line);
      }
      .swatch .name,
      .swatch .hex {
        font-size: var(--t-annotation);
        font-variant-numeric: tabular-nums;
        color: var(--on-darkroom-muted);
      }
      .swatch .name {
        font-weight: 600;
        color: var(--on-darkroom);
      }

      .stripe {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: var(--stripe);
        display: flex;
      }
      .stripe i {
        flex: 1;
      }
      .dip {
        position: absolute;
        inset: 0;
        background: var(--darkroom);
        opacity: 0;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="brand-card"
      data-start="0"
      data-duration="8"
      data-width="1920"
      data-height="1080"
    >
      <div id="card" class="card">
        <header class="head" id="head">
          <p class="eyebrow" id="eyebrow">Brand reference · v0</p>
          <h1 class="headline" id="headline">
            <span>Kodachrome,</span> <span>modern</span> <span>skeleton.</span>
          </h1>
          <p class="body" id="body">Warm paper, a darkroom where prints glow, and one geometric sans.</p>
        </header>

        <div class="figure chart" id="chart">
          <svg id="chart-svg"></svg>
          <div class="caption" id="chart-caption"></div>
        </div>

        <div class="figure cube" id="cube">
          <canvas id="cube-canvas"></canvas>
          <div class="caption" id="cube-caption">sRGB cube · palette</div>
        </div>

        <div class="palette" id="palette"></div>
      </div>

      <div class="stripe" id="stripe">
        <i style="background: var(--kodachrome-red)"></i>
        <i style="background: var(--kodachrome-yellow)"></i>
        <i style="background: var(--kodachrome-green)"></i>
        <i style="background: var(--kodachrome-blue)"></i>
      </div>
      <div class="dip" id="dip"></div>
    </div>

    <script type="module">
      import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js";
      import curves from "./brand/reference/brand-card/data/portra400-curves.json" with { type: "json" };

      const root = document.getElementById("root");
      const css = getComputedStyle(root);
      const token = (name) => css.getPropertyValue(name).trim();
      const sec = (name) => parseFloat(token(name));
      const W = Number(root.dataset.width);
      const H = Number(root.dataset.height);
      const DURATION = Number(root.dataset.duration);

      // Palette: names are token names; hex labels are read from the tokens,
      // never typed here.
      const PALETTE = [
        "kodachrome-red", "kodachrome-yellow", "kodachrome-green", "kodachrome-blue",
        "leader-cream", "paper", "ink", "darkroom",
      ];
      const palette = document.getElementById("palette");
      for (const name of PALETTE) {
        const el = document.createElement("div");
        el.className = "swatch";
        el.innerHTML = `<div class="chip" style="background: var(--${name})"></div>
          <span class="name">${name.replace(/^(kodachrome|leader)-/, "")}</span>
          <span class="hex">${token(`--${name}`).toUpperCase()}</span>`;
        palette.append(el);
      }

      await document.fonts.ready;

      // ---------- Chart: Portra 400 characteristic curves from JSON ----------
      const chart = document.getElementById("chart");
      const svg = document.getElementById("chart-svg");
      const chartCaption = document.getElementById("chart-caption");
      chartCaption.textContent = curves.caption;
      const cw = chart.clientWidth;
      const ch = chart.clientHeight;
      const unit = Math.min(W, H) / 100; // 1cqmin in px
      const pad = { l: 9 * unit, r: 3 * unit, t: chartCaption.offsetTop + chartCaption.offsetHeight + 3 * unit, b: 8 * unit };
      // Equal units on both axes (1 log H = 1 D, as on the datasheets), so the
      // slope you see is gamma at every ratio. The plot box is centred.
      const xr = curves.x.max - curves.x.min;
      const yr = curves.y.max - curves.y.min;
      const k = Math.min((cw - pad.l - pad.r) / xr, (ch - pad.t - pad.b) / yr);
      const ox = pad.l + (cw - pad.l - pad.r - k * xr) / 2;
      const oy = ch - pad.b - (ch - pad.t - pad.b - k * yr) / 2;
      const sx = (x) => ox + (x - curves.x.min) * k;
      const sy = (y) => oy - (y - curves.y.min) * k;
      const NS = "http://www.w3.org/2000/svg";
      const add = (tag, attrs, parent = svg) => {
        const el = document.createElementNS(NS, tag);
        for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, v);
        parent.append(el);
        return el;
      };
      svg.setAttribute("viewBox", `0 0 ${cw} ${ch}`);
      const axes = add("g", { id: "axes" });
      const stroke = token("--hairline");
      const hair = parseFloat(stroke) * unit;
      for (let x = Math.ceil(curves.x.min); x <= curves.x.max; x++) {
        add("line", { x1: sx(x), x2: sx(x), y1: sy(curves.y.min), y2: sy(curves.y.max), stroke: token("--viz-grid"), "stroke-width": hair }, axes);
        add("text", { x: sx(x), y: sy(curves.y.min) + 3.2 * unit, "text-anchor": "middle" }, axes).textContent = x.toFixed(0);
      }
      for (let y = curves.y.min; y <= curves.y.max; y += 1) {
        add("line", { x1: sx(curves.x.min), x2: sx(curves.x.max), y1: sy(y), y2: sy(y), stroke: token("--viz-grid"), "stroke-width": hair }, axes);
        add("text", { x: sx(curves.x.min) - 1.5 * unit, y: sy(y) + 0.8 * unit, "text-anchor": "end" }, axes).textContent = y.toFixed(0);
      }
      add("line", { x1: sx(curves.x.min), x2: sx(curves.x.max), y1: sy(0), y2: sy(0), stroke: token("--viz-grid-strong"), "stroke-width": hair * 1.5 }, axes);
      add("text", { x: sx(curves.x.max), y: sy(curves.y.min) + 6.4 * unit, "text-anchor": "end" }, axes).textContent = curves.x.label;
      const traces = ["b", "g", "r"].map((k) =>
        add("path", {
          d: curves.curves[k].map(([x, y], i) => `${i ? "L" : "M"}${sx(x).toFixed(1)},${sy(y).toFixed(1)}`).join(""),
          fill: "none",
          stroke: token(`--viz-${k}`),
          "stroke-width": hair * 2.5,
          "stroke-linejoin": "round",
          "stroke-linecap": "round",
        }),
      );

      // ---------- 3D: sRGB cube, palette at its exact code values ----------
      // Data is not styling: colours go in as sRGB hex and Three's colour
      // management converts to linear and back on output, so they round-trip.
      const canvas = document.getElementById("cube-canvas");
      const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true });
      renderer.setPixelRatio(1);
      const cw3 = canvas.clientWidth;
      const ch3 = canvas.clientHeight;
      renderer.setSize(cw3, ch3, false);
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.setClearColor(new THREE.Color(token("--viz-ground")), 1);
      const scene = new THREE.Scene();
      // Fit the cube's bounding sphere (radius sqrt(3)/2) in the narrower of
      // the two fields of view, with a margin, at any panel shape.
      const VFOV = 30;
      const camera = new THREE.PerspectiveCamera(VFOV, cw3 / ch3, 0.1, 100);
      const half = THREE.MathUtils.degToRad(VFOV / 2);
      const narrow = Math.min(half, Math.atan(Math.tan(half) * camera.aspect));
      const dist = (1.12 * Math.sqrt(3)) / 2 / Math.sin(narrow);
      camera.position.set(0, dist * 0.14, dist);
      camera.lookAt(0, 0, 0);
      const group = new THREE.Group();
      scene.add(group);

      const corners = [];
      for (let i = 0; i < 8; i++) corners.push([(i >> 2) & 1, (i >> 1) & 1, i & 1]);
      const pos = [];
      const col = [];
      for (let a = 0; a < 8; a++)
        for (let b = a + 1; b < 8; b++) {
          const d = corners[a].reduce((s, v, k) => s + Math.abs(v - corners[b][k]), 0);
          if (d !== 1) continue;
          for (const c of [corners[a], corners[b]]) {
            pos.push(c[0] - 0.5, c[1] - 0.5, c[2] - 0.5);
            const color = new THREE.Color().setRGB(c[0], c[1], c[2], THREE.SRGBColorSpace);
            col.push(color.r, color.g, color.b);
          }
        }
      const edges = new THREE.BufferGeometry();
      edges.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3));
      edges.setAttribute("color", new THREE.Float32BufferAttribute(col, 3));
      group.add(new THREE.LineSegments(edges, new THREE.LineBasicMaterial({ vertexColors: true })));

      const dot = new THREE.SphereGeometry(0.045, 24, 16);
      const dots = PALETTE.map((name) => {
        const c = new THREE.Color(token(`--${name}`));
        const srgb = c.clone().convertLinearToSRGB();
        const m = new THREE.Mesh(dot, new THREE.MeshBasicMaterial({ color: c }));
        m.position.set(srgb.r - 0.5, srgb.g - 0.5, srgb.b - 0.5);
        group.add(m);
        return m;
      });

      const DEG_PER_SEC = 20;
      const cubeIn = { t0: 1.5, dur: sec("--dur-develop") };
      function renderAt(t) {
        group.rotation.y = THREE.MathUtils.degToRad(-35 + DEG_PER_SEC * t);
        group.rotation.x = THREE.MathUtils.degToRad(18);
        const k = THREE.MathUtils.clamp((t - cubeIn.t0) / cubeIn.dur, 0, 1);
        const s = 0.5 - 0.5 * Math.cos(Math.PI * k); // sine.inOut, as --ease-develop
        group.scale.setScalar(0.001 + s);
        renderer.render(scene, camera);
      }
      window.addEventListener("hf-seek", (e) => renderAt(e.detail.time));
      renderAt(0);

      // ---------- Timeline ----------
      const ease = { enter: token("--ease-enter"), exit: token("--ease-exit"), develop: token("--ease-develop") };
      const develop = { opacity: 0, filter: "blur(1cqmin)" };
      const developed = { opacity: 1, filter: "blur(0cqmin)", duration: sec("--dur-develop"), ease: ease.develop };
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#stripe", { scaleX: 0, transformOrigin: "left center" }, { scaleX: 1, duration: sec("--dur-move"), ease: token("--ease-move") }, 0);
      tl.fromTo("#eyebrow", develop, developed, 0.1);
      tl.fromTo("#headline span", { opacity: 0, filter: "blur(0.6cqmin)" }, { opacity: 1, filter: "blur(0cqmin)", duration: sec("--dur-enter"), ease: ease.enter, stagger: sec("--stagger-word") }, 0.3);
      tl.fromTo("#body", develop, developed, 0.7);
      tl.fromTo("#palette .swatch", { opacity: 0, y: "2cqmin" }, { opacity: 1, y: 0, duration: sec("--dur-enter"), ease: ease.enter, stagger: sec("--stagger-item") }, 0.9);
      tl.fromTo("#chart", develop, developed, 1.1);
      tl.fromTo("#cube", develop, developed, 1.3);
      traces.forEach((p, i) => {
        const len = p.getTotalLength();
        tl.fromTo(p, { strokeDasharray: len, strokeDashoffset: len }, { strokeDashoffset: 0, duration: sec("--dur-develop"), ease: token("--ease-move") }, 1.8 + i * 0.35);
      });
      // Sample transition: safelight dip into the next scene.
      tl.fromTo("#dip", { opacity: 0 }, { opacity: 1, duration: sec("--dur-exit") * 2, ease: ease.exit }, DURATION - sec("--dur-exit") * 2 - 0.2);
      tl.set({}, {}, DURATION);

      window.__timelines = window.__timelines || {};
      window.__timelines["brand-card"] = tl;
    </script>
  </body>
</html>
